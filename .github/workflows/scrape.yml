name: Recall Watch Scraper

on:
  schedule:
    - cron: '41 */6 * * *'  # 每 6 小时第 41 分钟（召回、抽检公告一天只发几条）
  workflow_dispatch:        # 支持手动触发
  push:
    branches: [main]
    paths: ['scraper.py', '.github/workflows/scrape.yml']

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 首次全量要抓上千个详情页
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scraper
        run: python scraper.py
      - name: Commit data.json
        # data.json 里的 updated 每次都变，所以每次运行都会提交，仓库保持活跃、定时任务不会被停用
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
